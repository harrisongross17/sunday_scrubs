title: "Sunday Scrubs"
description: Weekly fantasy football recaps
theme: minima

# The GitHub repo is named "sunday_scrubs", so the site lives at /sunday_scrubs/
baseurl: "/sunday_scrubs"
permalink: /:year/:month/:day/:title.html
url: "https://harrisongross17.github.io"

# Header wordmark (small line above, big line below) and founding year
wordmark_top: ""
wordmark_main: "Sunday Scrubs"
founded: 2025

# Division badge colors, keyed by ESPN division name
show_divisions: false
divisions:
  {}

# Show ESPN team names next to managers. Sites are public.
show_team_names: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
    values:
      image: /assets/og-card.png

exclude:
  - README.md
